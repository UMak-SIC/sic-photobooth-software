# SIC Photobooth access point. Managed by config/captive-portal/install.sh.
interface={{WIFI_INTERFACE}}
driver=nl80211
country_code={{WIFI_COUNTRY_CODE}}
ieee80211d=1

ssid={{SSID}}
utf8_ssid=1
hw_mode={{WIFI_HW_MODE}}
channel={{WIFI_CHANNEL}}
ieee80211n=1
wmm_enabled=1

auth_algs=1
wpa=2
wpa_passphrase={{HOTSPOT_PASSWORD}}
wpa_key_mgmt=WPA-PSK SAE
rsn_pairwise=CCMP
ieee80211w=1
sae_pwe=2
