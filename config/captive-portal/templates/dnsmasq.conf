# SIC Photobooth captive portal. Managed by config/captive-portal/install.sh.
interface={{WIFI_INTERFACE}}
bind-dynamic
no-resolv
no-hosts
domain-needed
bogus-priv
dhcp-authoritative
dhcp-range={{DHCP_RANGE_START}},{{DHCP_RANGE_END}},{{SUBNET_MASK}},12h
dhcp-option=option:router,{{GATEWAY_IP}}
dhcp-option=option:dns-server,{{GATEWAY_IP}}
address=/#/{{GATEWAY_IP}}
